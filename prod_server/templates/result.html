<!DOCTYPE html>
<html>
<head>
<title>Test App</title>
</head>
<body>

<h1>Repository Star Rankings</h1>

<table BORDER=1>
<thead>
<tr>
<th>Repository</th><th>Actual Stars</th><th>Predicted Stars</th>
</tr>
</thead>
<tbody>

{% for repo in final_results %}
<tr>
    <td>{{ repo.repo_name }}</td>
    <td>{{ repo.actual_stars }}</td>
    <td>{{ repo.predicted_stars }}</td>
</tr>
{% endfor %}

</tbody>
</table>

<br><br>
<div style="display: flex; gap: 10px;">
    <form action="/" method="GET">
        <button type="submit">Front Page</button>
    </form>

    <form action="/predictions" method="GET">
        <button type="submit">Run Another Test</button>
    </form>
</div>
</body>
</html>
