- hosts: all
  vars_files:
   - setup_var.yml 

  tasks:
   - name: Generate hosts file
     lineinfile: 
       dest: /etc/hosts
       regexp: '.*{{ item }}$'
       line: "{{ hostvars[item].ansible_default_ipv4.address }} {{item}}"
       state: present            
     when: hostvars[item].ansible_default_ipv4.address is defined
     with_items: "{{groups['all']}}"
     become: true


   - name: apt update
     apt: update_cache=yes upgrade=dist
     become: true

   - name: Ensure cluster-keys directory exists
     become: false
     file:
       path: "{{ cluster_keys_dir }}"
       state: directory
       mode: '0755'
       owner: appuser
       group: appuser

   - name: Copy deploy private key to target server
     become: false
     copy:
      src: "{{ deploy_key_dir }}/deploy-key"
      dest: "{{ cluster_keys_dir }}/deploy-key"
      mode: '0600'

   - name: Download git repository
     become: false
     git:
       repo: "{{ repo_url }}"
       dest: "{{ repo_dest }}"
       version: "{{ repo_branch }}"
       key_file: "{{ cluster_keys_dir }}/deploy-key"
       accept_hostkey: yes
      

- hosts: prodserver
 
  vars_files:
   - setup_var.yml  
  
  tasks:
   - name: Extra packages
     apt: pkg={{item}} state=latest update_cache=true
     with_items:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
     become: true

   - name: Add Docker repository key
     apt_key:
       url: https://download.docker.com/linux/ubuntu/gpg
       state: present
     become: true

   - name: Add Docker repository
     apt_repository:
       repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu focal stable"
       state: present
     become: true

   - name: apt update
     apt: update_cache=yes upgrade=dist
     become: true

   # Workaround pip issue with MTU mismatch
   - name: Create Ansible docker config directory.
     become: true
     file:
       path: "/etc/docker"
       state: directory

   - name: Create Ansible docker file to configure Docker MTU to match SNIC for pip issue
     become: true
     copy:
       dest: "/etc/docker/daemon.json"
       content: |
         {
           "mtu": 1450
         }

   - name: Install Docker and Docker Compose plugin
     apt: pkg={{item}} state=present update_cache=true allow_unauthenticated=yes
     with_items:
      - docker-ce
      - docker-compose-plugin
     become: true

   - name: Add appuser to docker group
     user:
       name: appuser
       groups: docker
       append: yes
     become: true

   - name: running containers
     become: false
     shell: docker compose up -d
     args:
       chdir: "{{ repo_dest }}/prod_server"

- hosts: devserver
  
  vars_files:
   - setup_var.yml

  tasks:
   - name: Extra packages
     apt: pkg=python3-pip state=latest update_cache=true  
     become: true

   - name: Flush paths for pip installation tracking
     meta: flush_handlers

   - name: Install ML packages
     become: true
     pip: 
       executable: pip3
       name:
         - "torch"
         - "scikit-learn"
         - "numpy"
         - "pandas"
         - "requests"
         - "pygithub"
